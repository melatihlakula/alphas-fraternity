<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ALPHAS Fraternity</title>
    <link rel="stylesheet" href="tailwind-like.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center relative">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <img src="newlogo.jpeg" alt="ALPHAS Logo" class="w-16 h-16 rounded-lg object-cover mx-auto mb-4">
            <h1 class="text-3xl font-black text-gray-900 dark:text-white tracking-wider mb-2">ALPHAS</h1>
            <p class="text-gray-600 dark:text-gray-400">Create Team Account</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <form id="signupForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Username <span class="text-red-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    required
                    minlength="3"
                    maxlength="50"
                    pattern="[a-zA-Z0-9_]+"
                    title="Username must be 3-50 characters, letters, numbers, and underscores only"
                    autocomplete="username"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="Choose a username"
                >
                <p class="text-xs text-gray-500 mt-1">3-50 characters, letters, numbers, and underscores only</p>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Email <span class="text-red-500">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="your.email@example.com"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Password <span class="text-red-500">*</span>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="Minimum 6 characters"
                >
                <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Confirm Password <span class="text-red-500">*</span>
                </label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword"
                    required
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="Confirm your password"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-8 py-4 rounded-lg font-semibold hover:-translate-y-1 hover:shadow-xl transition-all duration-300"
            >
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center space-y-2">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Already have an account?
                <a href="/login" class="text-red-600 dark:text-red-400 hover:underline font-semibold">Sign In</a>
            </p>
            <a href="/" class="text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-400 transition-colors duration-300 text-sm">
                ← Back to Website
            </a>
        </div>
        
        <!-- Theme Toggle Button -->
        <div class="absolute top-4 right-4">
            <button class="w-10 h-10 border-2 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-full flex items-center justify-center hover:bg-red-600 hover:border-red-600 hover:text-white transition-all duration-300" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        const signupForm = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function hideMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            const normalizedUsername = username.trim().toLowerCase();
            
            if (!normalizedUsername || normalizedUsername.length < 3) {
                showError('Username must be at least 3 characters');
                return;
            }

            if (normalizedUsername.length > 50) {
                showError('Username must be 50 characters or less');
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(normalizedUsername)) {
                showError('Username can only contain letters, numbers, and underscores');
                return;
            }

            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('Please enter a valid email address or leave it blank');
                return;
            }

            if (!password || password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Store session ID if provided (auto-login)
                    if (result.sessionId) {
                        localStorage.setItem('sessionId', result.sessionId);
                        showSuccess('Account created successfully! Redirecting to admin...');
                        
                        // Redirect to admin after 1 second
                        setTimeout(() => {
                            window.location.href = '/admin';
                        }, 1000);
                    } else {
                        showSuccess('Account created successfully! Redirecting to login...');
                        
                        // Redirect to login after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                    }
                } else {
                    showError(result.message || 'Failed to create account. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            } catch (error) {
                console.error('Signup error:', error);
                showError('Network error. Please check your connection and try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
