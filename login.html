<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ALPHAS Fraternity</title>
    <link rel="stylesheet" href="tailwind-like.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <img src="newlogo.jpeg" alt="ALPHAS Logo" class="w-16 h-16 rounded-lg object-cover mx-auto mb-4">
            <h1 class="text-3xl font-black text-gray-900 dark:text-white tracking-wider mb-2">ALPHAS</h1>
            <p class="text-gray-600 dark:text-gray-400">Admin Login</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="Enter your username"
                >
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    autocomplete="current-password"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:border-red-500 dark:focus:border-red-400 focus:outline-none transition-colors duration-300"
                    placeholder="Enter your password"
                >
            </div>
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-8 py-4 rounded-lg font-semibold hover:-translate-y-1 hover:shadow-xl transition-all duration-300"
            >
                Login
            </button>
        </form>

        <div class="mt-6 text-center space-y-2">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Don't have an account?
                <a href="/signup" class="text-red-600 dark:text-red-400 hover:underline font-semibold">Sign Up</a>
            </p>
            <a href="/" class="text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-400 transition-colors duration-300 text-sm">
                ← Back to Website
            </a>
        </div>
        
        <!-- Theme Toggle Button -->
        <div class="absolute top-4 right-4">
            <button class="w-10 h-10 border-2 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-full flex items-center justify-center hover:bg-red-600 hover:border-red-600 hover:text-white transition-all duration-300" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function hideMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Store session ID
                    localStorage.setItem('sessionId', result.sessionId);
                    
                    showSuccess('Login successful! Redirecting...');
                    
                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1000);
                } else {
                    showError(result.message || 'Login failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection and try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // Check if already logged in
        const sessionId = localStorage.getItem('sessionId');
        if (sessionId) {
            fetch('/api/auth/verify', {
                headers: {
                    'X-Session-Id': sessionId
                }
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    window.location.href = '/admin';
                }
            })
            .catch(() => {
                localStorage.removeItem('sessionId');
            });
        }
    </script>
</body>
</html>
